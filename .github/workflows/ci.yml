name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  linux:
    name: Linux compile and platform regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo +nightly fmt --check

      - name: Check
        run: cargo +nightly check --locked --all-targets --all-features

      - name: Non-Windows generation publication regression
        run: cargo +nightly test --locked --lib --all-features store::operation_txn::tests::production_directory_visibility_uses_same_parent_atomic_rename -- --exact

      - name: Clippy
        run: cargo +nightly clippy --locked --all-targets --all-features -- -D warnings

  windows:
    name: Windows full test suite
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test all targets and features
        run: cargo +nightly test --locked --all-targets --all-features
